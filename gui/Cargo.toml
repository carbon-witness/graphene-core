[package]
name = "graphene-node-gui"
version = "0.1.0"
edition = "2021"
description = "Tray supervisor and dashboard for witness_node on Windows"
license = "MIT"

[[bin]]
name = "graphene-node"
path = "src/main.rs"

# Runs the supervisor without the window, for tests under Wine (no WebView2 there)
[[bin]]
name = "supervisor-cli"
path = "src/cli.rs"

[lib]
name = "node_gui"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = "s"
lto = true
strip = true
